<form class="flex flex-col gap-3.5" novalidate (submit)="onSubmit($event)">
  @let emailField = userForm.email();
  <label class="flex flex-col gap-1.5">
    <span class="text-meta text-ink-5">Рабочая почта</span>
    <input
      class="field"
      type="email"
      autocomplete="off"
      placeholder="i.ivanov@company.ru"
      [formField]="userForm.email"
      [attr.aria-invalid]="emailField.touched() && emailField.invalid()"
    />
    @if (emailField.touched() && emailField.invalid()) {
      <span class="text-xs text-warn">{{ emailField.errors()[0]?.message }}</span>
    }
  </label>

  @let nameField = userForm.displayName();
  <label class="flex flex-col gap-1.5">
    <span class="text-meta text-ink-5">ФИО</span>
    <input
      class="field"
      placeholder="Иванов Иван Иванович"
      [formField]="userForm.displayName"
      [attr.aria-invalid]="nameField.touched() && nameField.invalid()"
    />
    @if (nameField.touched() && nameField.invalid()) {
      <span class="text-xs text-warn">{{ nameField.errors()[0]?.message }}</span>
    }
  </label>

  @let departmentField = userForm.department();
  <label class="flex flex-col gap-1.5">
    <span class="text-meta text-ink-5">Отдел</span>
    <input
      class="field"
      placeholder="Проектный отдел · АР"
      [formField]="userForm.department"
      [attr.aria-invalid]="departmentField.touched() && departmentField.invalid()"
    />
    @if (departmentField.touched() && departmentField.invalid()) {
      <span class="text-xs text-warn">{{ departmentField.errors()[0]?.message }}</span>
    }
  </label>

  @let passwordField = userForm.password();
  <label class="flex flex-col gap-1.5">
    <span class="flex items-baseline justify-between">
      <span class="text-meta text-ink-5">Пароль</span>
      <button type="button" class="flex items-center gap-1 text-xs text-acc-t hover:text-acc-hi" (click)="regeneratePassword()">
        <fa-icon class="icon" icon="dice" /> сгенерировать другой
      </button>
    </span>
    <input
      class="field font-mono"
      autocomplete="off"
      [formField]="userForm.password"
      [attr.aria-invalid]="passwordField.touched() && passwordField.invalid()"
    />
    @if (passwordField.touched() && passwordField.invalid()) {
      <span class="text-xs text-warn">{{ passwordField.errors()[0]?.message }}</span>
    }
  </label>

  <label class="flex flex-col gap-1.5">
    <span class="text-meta text-ink-5">Роль</span>
    <select class="field" [formField]="userForm.role">
      <option value="User">Сотрудник</option>
      <option value="Admin">Администратор</option>
    </select>
  </label>

  @if (error(); as message) {
    <div class="rounded-tile border border-warn-bd bg-warn-bg px-4 py-3 text-[13px] text-ink-2" role="alert">
      {{ message }}
    </div>
  }

  <div class="flex gap-2.5 pt-1">
    <button type="button" class="btn-ghost flex-1" (click)="cancelled.emit()">Отмена</button>
    <button type="submit" class="btn-primary flex-1" [disabled]="busy()">
      {{ busy() ? 'Создаём…' : 'Создать' }}
    </button>
  </div>
</form>
