resolver 127.0.0.11 valid=10s ipv6=off;

upstream auth_service {
    zone auth_service 64k;
    server auth:8080 resolve;
}

upstream storage_service {
    zone storage_service 64k;
    server storage:8080 resolve;
}

upstream print_service {
    zone print_service 64k;
    server print:8080 resolve;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 200m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'self' blob:; frame-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /api/auth {
        proxy_pass http://auth_service/auth;
    }

    location /api/drawings {
        proxy_pass http://storage_service/drawings;
    }

    location /api/print {
        proxy_pass http://print_service/print;
    }

    location /api/ {
        return 404;
    }

    root /usr/share/nginx/html;

    location ~* \.(?:js|css|woff2?|svg|png|ico|map)$ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
